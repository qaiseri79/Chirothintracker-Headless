      plugin: get
      source: entityform_id
  contact_form:
    -
      plugin: get
      source: type
  uid:
    -
      plugin: get
      source: uid
  created:
    -
      plugin: get
      source: created
  changed:
    -
      plugin: get
      source: changed
  langcode:
    -
      plugin: default_value
      source: language
      default_value: en
  'dependencies/module/[]':
