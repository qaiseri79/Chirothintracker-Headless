    '#title': 'Chiropractor Full Name'
    '#description': '<p><strong>Enter full name.</strong></p>'
    '#required': true
    '#unique': true
    '#unique_user': true
    '#unique_error': 'Full name must be unique.'
  chiropractor_email:
    '#type': email
    '#title': 'Chiropractor Email'
    '#description': '<p><strong>Enter authentic email address</strong></p>'
    '#required': true
  status:
    '#type': select
    '#title': Status
    '#options':
      pending: Pending
      freetrial: Free-Trial
    '#default_value': pending
    '#access_view_roles':
      - administrator
    '#access': false
  trial_period:
    '#type': select
    '#title': 'Trial period'
    '#options':
      4: '4 weeks'
      8: '8 weeks'
      52: '12 Months'
    '#default_value': '4'
    '#access': false
  product_id:
    '#type': entity_autocomplete
    '#title': 'Product Id'
    '#default_value': '[current-page:query:product_id]'
    '#access': false
    '#target_type': commerce_product
    '#selection_handler': 'default:commerce_product'
    '#selection_settings':
      target_bundles:
        subscription: subscription
  captcha:
    '#type': captcha
    '#captcha_type': recaptcha/reCAPTCHA
