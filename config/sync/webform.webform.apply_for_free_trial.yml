elements: |-
  clinic_title:
    '#type': textfield
    '#title': 'Clinic Title'
    '#description': '<p><strong>Enter a clinic title, which will be associated to your account.</strong></p>'
    '#required': true
    '#unique': true
    '#unique_entity': true
    '#unique_error': 'The clinic title must be unique.'
  chiropractor_full_name:
