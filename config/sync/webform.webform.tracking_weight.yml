        - chiropractor_active_
      '#access_update_roles':
        - administrator
        - chiropractor_active_
      '#access_view_roles':
        - administrator
        - chiropractor_active_
      '#vocabulary': chiropractor_flags
      '#breadcrumb_delimiter': ›
    field_notes:
      '#type': textarea
      '#title': 'Personal Notes'
  group_diabetes:
    '#type': details
    '#title': 'Blood Sugar (Today)'
    field_blood_sugar:
      '#type': textfield
      '#title': 'Morning Blood Sugar'
  group_hypertension:
    '#type': details
    '#title': 'Blood Pressure (Today)'
    field_blood_pressure:
      '#type': textfield
      '#title': 'Blood Pressure'
  group_measurements:
    '#type': details
    '#title': 'Body Measurements (Today)'
    markup:
      '#type': webform_markup
      '#markup': '<p>Watch Video: <a href="https://vimeo.com/272650849">Taking your body measurements</a></p>'
    field_neck:
      '#type': number
      '#title': Neck
    field_shoulders:
      '#type': number
      '#title': Shoulders
    field_chest:
      '#type': number
      '#title': Chest
    field_arm_left_bicep:
      '#type': number
      '#title': 'Arm - Left Bicep'
    field_arm_right_bicep:
      '#type': number
      '#title': 'Arm - Right Bicep'
    field_abdomen:
      '#type': number
      '#title': Abdomen
    field_hips:
      '#type': number
      '#title': Hips
    field_thigh_left:
      '#type': number
      '#title': 'Thigh - Left'
    field_thigh_right:
      '#type': number
      '#title': 'Thigh - Right'
    field_calf_left:
      '#type': number
      '#title': 'Calf - Left'
    field_calf_right:
      '#type': number
      '#title': 'Calf - Right'
  group_questions:
    '#type': webform_section
    '#title': 'Message your Doctor'
    field_question:
      '#type': text_format
      '#title': 'Send a message to your doctor'
      '#allowed_formats':
        webform_default: webform_default
      '#hide_help': true
  current_phase:
    '#type': hidden
    '#title': 'Current Phase'
  field_weight_loss_to_date:
    '#type': textfield
    '#title': 'Weight Loss To Date'
  field_program_day:
    '#type': textfield
    '#title': 'Program Day'
  field_total_measurements:
    '#type': number
    '#title': 'Total Measurements'
  field_archive:
    '#type': checkbox
    '#title': Archive
  field_program_day_computed:
    '#type': number
    '#title': 'Program Day Computed'
  field_weight_loss_computed:
