cancel_confirm:
  subject: 'Account details for [user:name] at [site:name] (canceled)'
  body: "[user:name],\r\n\r\nYour account on [site:name] has been canceled.\r\n\r\n--  [site:name] team"
password_reset:
  subject: 'Replacement login information for [user:name] at [site:name]'
  body: "[user:field_full_name],\r\n\r\nA request to reset the password for your account has been made at [site:name].\r\n\r\nYou may now log in by clicking this link or copying and pasting it to your browser:\r\n\r\n[user:one-time-login-url]\r\n\r\nThis link can only be used once to log in and will lead you to a page where you can set your password. It expires after one day and nothing will happen if it's not used.\r\n\r\n--  [site:name]"
register_admin_created:
  subject: 'Your Weight Loss Tracking Account at [current-user:field_clinic:entity] is Ready'
  body: "<h1>Thank you so much for being a part of our family!</h1>\r\n<p>[user:field_full_name],</p>\r\n<p>We have an amazing software system and mobile app that is included free of charge with your program.  It will help you get on track and help us help keep you on track!</p>\r\n<p>An account has been created for you at [site:name]. You may now log in by clicking this link or copying and pasting it to your browser:</p>\r\n<span><a href=\"[user:one-time-login-url]\" target=\"_blank\">[user:one-time-login-url]</a></p></span>\r\n<p>After setting your password, you will be able to log in at [site:base-url] in the future using:</p>\r\n<p><span>username: [user:mail]</span><br>\r\n<span>password: Your password</span></p>\r\n<p>Once logged in, add this page to your home screen on your mobile device and/or make this site a favorite if using a computer. It works best on Chrome Browser.</p>\r\n<p>Android users: Use your browser's menu and choose \"Add to Home Screen\"</p>\r\n<p>iPhone users: Click the \"Share\" button, choose \"Add to Home Screen\", then \"Add\"</p>\r\n<p>IMPORTANT - Please log your weight every day. We recommend logging in the morning before 9:00 am.</p>\r\n<p><img src=\"[site:base-url]/sites/default/files/1-log.PNG\"></p>\r\n<h2>Log My Weight</h2>\r\n<p>Please complete all the fields. Note that the first line defaults to 5/10, but you need to change it to reflect your own self-assessment for the prior day. The date also defaults to the current day, but it can be changed if you are logging for a missed day in the past, for example. Note that weight and water intake are REQUIRED fields – missing these will prevent your log from being submitted.</p>\r\n<p>Then click on each subsequent section and complete all relevant and necessary data paying special attention to your Food Log and the Flags and Notes tabs. The Blood Sugar/Blood Pressure/Body Measurements fields will be discussed with you as to whether those need to be completed. If you have a message or question for us, please use the Message Your Doctor feature.</p>\r\n<p><img src=\"[site:base-url]/sites/default/files/5-messages.PNG\"></p>\r\n<h2>Messages</h2>\r\n<p>You can also send us a message by clicking the Messages icon. All correspondence between us will be stored in this area.</p>\r\n<p><img src=\"[site:base-url]/sites/default/files/3-resources.PNG\"><img src=\"[site:base-url]/sites/default/files/4-training.PNG\"></p>\r\n</p>\r\n<h2>Training and Resources</h2>\r\n<p>Please also review the Training Videos and Resources in order to get yourself prepared for your weight loss journey.</p>\r\n<p>&nbsp;</p>\r\n<p>We sincerely hope you enjoy using this app to track your progress and once again, welcome aboard - We are excited to be a part of your journey!</p>\r\n<p>Your [site:name] Team</p>"
register_no_approval_required:
  subject: 'Welcome to ChiroThinTracker.com!'
  body: "<h1>Welcome to ChiroThinTracker.com!</h1>\r\n<h2>Getting Started</h2>\r\n<p>We recommend visiting https://doctors.chirothintracker.com for some introduction videos. You'll also find detailed training videos. To access those, just log in to your account using the \"My Account\" link. You can reset your password using the \"Forgot My Password\" link, if necessary. Once you're logged in, click on \"Training\" on the menu for a comprehensive list of training videos.</p>\r\n<h2>Logging In</h2>\r\n<p>The personalized link for you and your patients is [site:base-url]. You'll use that to connect to your dashboard, and your patients will use that to log their weight every day.</p>\r\n<p>Create a new password using the link below:<br />\r\n<a href=\"[user:one-time-login-url]\" target=\"_blank\">[user:one-time-login-url]</a></p>\r\n<p>This link can only be used once to log in and will lead you to a page where you can set your password.</p>\r\n<p>After setting your password, you will be able to log in at [site:base-url] in the future using:</p>\r\n<p>username: [user:mail]<br />\r\npassword: Your password</p>\r\n<h2>Support</h2>\r\n<p>We are always available to provide technical assistance. Just send an e-mail to support@chirothintracker.com or use the Support link when you're logged in to your personalized portal.</p>\r\n<h2>e-Commerce</h2>\r\n<p>To set up your e-Commerce store, please submit a support ticket using the Support link on your dashboard, or e-mail support@chirothintracker.com.</p>"
