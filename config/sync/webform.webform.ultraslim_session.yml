id: ultraslim_session
title: 'UltraSlim Session'
description: ''
categories: {  }
elements: |-
  patient_profile:
    '#type': webform_entity_select
    '#title': 'Patient Profile'
    '#prepopulate': true
    '#default_value': '[current-page:query:profile_id]'
    '#access': false
    '#target_type': patient_profile
    '#selection_handler': views
    '#selection_settings':
      view:
        view_name: my_patient_profiles
        display_name: entity_reference_1
        arguments:
          - '[current-page:query:uid]'
  vitals:
    '#type': details
    '#title': Vitals
    '#align_items': flex-end
    date:
      '#type': date
      '#title': Date
      '#required': true
      '#default_value': '[current-date:html_date]'
      '#date_date_min': '-3 years'
      '#date_date_max': '+3 years'
    weight:
      '#type': number
      '#title': Weight
    blood_pressure:
      '#type': textfield
      '#title': 'Blood Pressure'
  treatment_type:
    '#type': details
    '#title': 'Treatment Type'
    '#format': details-closed
    treatment_type_:
      '#type': webform_term_checkboxes
      '#title': 'Treatment Type'
      '#vocabulary': ultraslim_treatment_protocols
      '#breadcrumb_delimiter': ›
    subcutaneous_fat:
      '#type': webform_term_checkboxes
      '#title': 'Subcutaneous Fat'
      '#states':
        visible:
          ':input[name="treatment_type_[362]"]':
            checked: true
      '#vocabulary': subcutaneous_fat
      '#breadcrumb_delimiter': ›
    skin_tightening:
      '#type': webform_term_checkboxes
      '#title': 'Skin Tightening'
      '#states':
        visible:
          ':input[name="treatment_type_[363]"]':
            checked: true
      '#vocabulary': skin_tightening
      '#breadcrumb_delimiter': ›
    cellulite:
      '#type': webform_term_checkboxes
      '#title': Cellulite
      '#states':
        visible:
          ':input[name="treatment_type_[364]"]':
            checked: true
      '#vocabulary': cellulite
      '#breadcrumb_delimiter': ›
  notes_group:
    '#type': details
    '#title': Notes
    '#format': details-closed
    notes:
      '#type': textarea
      '#title': Notes
    before_and_after_photos:
      '#type': webform_image_file
      '#title': 'Before and After Photos'
      '#multiple': 10
      '#file_preview': 'thumbnail:image'
      '#attachment_image_style': thumbnail
  body_measurements_group:
    '#type': details
    '#title': 'Body Measurements'
    '#format': details-closed
    show_all_measurements:
      '#type': checkbox
      '#title': 'Show All Measurements'
    neck:
      '#type': number
      '#title': Neck
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    arm_left_bicep:
      '#type': number
      '#title': 'Arm - Left Bicep'
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    arm_right_bicep:
      '#type': number
      '#title': 'Arm - Right Bicep'
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    back_bra_line:
      '#type': number
      '#title': 'Back / Bra-Line'
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    abdomen:
      '#type': number
      '#title': Abdomen
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    hips:
      '#type': number
      '#title': Hips
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    buttocks:
      '#type': number
      '#title': Buttocks
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    thigh_left:
      '#type': number
      '#title': 'Thigh - Left'
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    thigh_right:
      '#type': number
      '#title': 'Thigh - Right'
      '#states':
        visible:
          ':input[name="show_all_measurements"]':
            checked: true
    waist_buster_zone_1:
      '#type': number
      '#title': 'Waist Buster Zone 1'
    waist_buster_zone_2:
      '#type': number
      '#title': 'Waist Buster Zone 2'
    waist_buster_zone_3:
      '#type': number
      '#title': 'Waist Buster Zone 3'
    waist_buster_zone_4:
      '#type': number
      '#title': 'Waist Buster Zone 4'
    waist_buster_zone_5_male_:
      '#type': number
      '#title': 'Waist Buster Zone 5 (Male)'
    waist_buster_zone_6_female_right_thigh_:
      '#type': number
      '#title': 'Waist Buster Zone 6 (Female, Right Thigh)'
    waist_buster_zone_6_female_left_thigh_:
      '#type': number
      '#title': 'Waist Buster Zone 6 (Female, Left Thigh)'
    visceral_fat_zone_1:
      '#type': number
      '#title': 'Visceral Fat Zone 1'
    visceral_fat_zone_2:
      '#type': number
      '#title': 'Visceral Fat Zone 2'
    visceral_fat_zone_3:
      '#type': number
      '#title': 'Visceral Fat Zone 3'
    visceral_fat_zone_4:
      '#type': number
      '#title': 'Visceral Fat Zone 4'
    visceral_fat_zone_5:
      '#type': number
      '#title': 'Visceral Fat Zone 5'
    visceral_fat_zone_6_female_:
      '#type': number
      '#title': 'Visceral Fat Zone 6 (Female)'
  waistbuster_protocol:
    '#type': textarea
    '#title': 'WaistBuster Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[360]"]':
          checked: true
    '#default_value': |-
      Distance: 6 inches
      Time: 8 minutes, 4 sides (32 minutes total)
  visceral_fat_protocol:
    '#type': textarea
    '#title': 'Visceral Fat Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[361]"]':
          checked: true
    '#default_value': |-
      Distance: 1 inch
      Time: 8 minutes, 4 sides (32 minutes total)
  subcutaneous_fat_protocol:
    '#type': textarea
    '#title': 'Subcutaneous Fat Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[362]"]':
          checked: true
    '#default_value': |-
      Distance: 6 inches
      Time: 8 minutes per area

      You may use 4 treatments at 8 minutes each for a total of 32 minutes over multiple areas.
  skin_tightening_protocol:
    '#type': textarea
    '#title': 'Skin Tightening Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[363]"]':
          checked: true
    '#default_value': |-
      Distance: 6 inches
      Time: 20 minutes

      You may treat two separate areas for a total of 40 minutes.
  cellulite_protocol:
    '#type': textarea
    '#title': 'Cellulite Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[364]"]':
          checked: true
    '#default_value': |-
      Treat at 2 inches for 8 minutes, then 6 inches for 12 minutes for a total of 20 minutes per area.

      You may do this once from the front and once from the back for a total of 40 minutes if needed.
  facial_rejuvenation_protocol:
    '#type': textarea
    '#title': 'Facial Rejuvenation Protocol'
    '#states':
      visible:
        ':input[name="treatment_type_[365]"]':
          checked: true
    '#default_value': |-
      Face, Neck, and Chin (all at once)
      Distance: 6 inches
      Time: 20 minutes, 2 sides (total 40 minutes)
