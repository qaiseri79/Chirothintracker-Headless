services:
  custom_module.services:
    class: Drupal\custom_module\Service\CMServices
    arguments: ["@entity_type.manager", "@current_user", "@database", "@messenger"]
  custom_module.event_subscriber:
    class: Drupal\custom_module\EventSubscriber\CartEventSubscriber
    arguments: ['@messenger', '@commerce_cart.cart_manager']
    tags:
      - { name: event_subscriber }
  custom_module.order_paid_subscriber:
    class: Drupal\custom_module\EventSubscriber\OrderPaidSubscriber
    arguments: ['@plugin.manager.mail', '@logger.factory', '@language_manager', '@flag']
    tags:
      - { name: event_subscriber }
  custom_module.custom_request_subscriber:
    class: Drupal\custom_module\EventSubscriber\CustomRequestSubscriber
    arguments: ['@current_user', '@entity_type.manager']
    tags:
      - { name: event_subscriber } 
  # custom_module.event_subscriber.subscription_update_event_subscriber:
  #   class: Drupal\custom_module\EventSubscriber\SubscriptionUpdateEventSubscriber
  #   arguments: []
  #   tags:
  #     - { name: kernel.event_subscriber }
  custom_module.subscriber_event_subscriber:
    class: Drupal\custom_module\EventSubscriber\RedirectSubscriber
    arguments: ['@current_user', '@router.request_context']
    tags:
      - { name: event_subscriber }
  custom_module.subscription_cancel_subscriber:
    class: Drupal\custom_module\EventSubscriber\SubscriptionCancelSubscriber
    arguments: ['@logger.factory', '@entity_type.manager']
    tags:
      - { name: event_subscriber }
  custom_module.subscription_fix_subscriber:
    class: Drupal\custom_module\EventSubscriber\SubscriptionFixSubscriber
    tags:
      - { name: event_subscriber }
  custom_module.route_subscriber:
    class: Drupal\custom_module\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
  custom_module.product_variation_lazy_builders:
    class: Drupal\custom_module\ProductVariationLazyBuilders
    arguments: ['@entity_type.manager', '@form_builder', '@entity.repository']