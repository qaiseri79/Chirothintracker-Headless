headless_subscriptions.plans:
  path: '/api/headless/subscriptions/plans'
  defaults:
    _controller: '\Drupal\headless_subscriptions\Controller\SubscriptionController::handle'
    _format: json
    action: 'plans'
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\headless_subscriptions\Access\PublicSubscriptionAccess::access'
  options:
    no_cache: TRUE

