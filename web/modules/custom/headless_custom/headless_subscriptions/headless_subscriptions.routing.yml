headless_subscriptions.admin:
  path: '/admin/commerce/portal-subscriptions'
  defaults:
    _controller: '\Drupal\headless_subscriptions\Controller\SubscriptionAdminController::listing'
    _title: 'Portal subscriptions'
  requirements:
    _permission: 'administer portal subscriptions'

headless_subscriptions.admin_detail:
  path: '/admin/commerce/portal-subscriptions/{uid}'
  defaults:
    _controller: '\Drupal\headless_subscriptions\Controller\SubscriptionAdminController::detail'
    _title: 'Doctor subscription'
  requirements:
    _permission: 'administer portal subscriptions'
    uid: '\d+'

headless_subscriptions.admin_refresh:
  path: '/admin/commerce/portal-subscriptions/{uid}/refresh'
  defaults:
    _form: '\Drupal\headless_subscriptions\Form\SubscriptionAdminActionForm'
    _title: 'Manage doctor subscription'
    operation: 'refresh'
  requirements:
    _permission: 'administer portal subscriptions'
    uid: '\d+'

headless_subscriptions.admin_cancel:
  path: '/admin/commerce/portal-subscriptions/{uid}/cancel'
  defaults:
    _form: '\Drupal\headless_subscriptions\Form\SubscriptionAdminActionForm'
    _title: 'Manage doctor subscription'
    operation: 'cancel'
  requirements:
    _permission: 'administer portal subscriptions'
    uid: '\d+'

