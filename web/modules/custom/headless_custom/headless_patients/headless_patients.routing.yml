# Headless Patients routes.
#
# ## Access
#
# Every route is gated by a policy class from the headless_access module rather
# than by a permission declared here. That module holds the portal's role machine
# names in one place, so the read/write distinction is stated the same way in every
# headless module instead of being re-derived per module.
#
#   ReadChiropractorAccess   — the roster, archived patients, intake, phase options
#   WriteChiropractorAccess  — create, archive, re-enrol, review state
#
# Cancelling a subscription moves an account to `chiropractor_inactive_`, which
# keeps ReadChiropractorAccess and loses WriteChiropractorAccess. That is the whole
# read-only posture, and it is a one-line difference between the two role lists.
#
# ## Requirements, not defaults
#
# `_custom_access` sits in `requirements` because that is the only block Drupal
# evaluates for access. The previous revision of this file put `_permission` under
# `defaults`, where it became an inert route default: all nine routes were
# registered, none of them enforced anything, and the permission strings were
# simply unread. Same for `_auth`, which Drupal reads as a route *option*
# (AuthenticationManager), so `requirements` was wrong for it too. Both are in the
# right blocks now.
#
# No `_access: 'TRUE'` is written anywhere in this file. AccessAwareRouter adds that
# requirement itself to every route, and hand-writing it only obscures whether a
# gate is actually present.
#
# ## No CSRF token on the POST routes
#
# This matches headless_progress rather than being an oversight. The session cookie
# is forwarded from the Next.js server and is HttpOnly, so a cross-site form post
# cannot carry it, and there is no browser JS in this system that holds a cookie.
# The only CSRF token anywhere is the logout token, which is session-bound and
# single-use by design. Do not add a token check here without first giving the
# client a way to obtain a valid one, or every write will fail with a 403 that
# looks like a permissions problem.
#
# ## The clinic is never a parameter
#
# The clinic is not a route parameter, a query parameter or a body field. It is
# resolved from the authenticated account by ClinicScope, so no request can select a
# tenant. Every route below that takes a `{user}` still has to pass
# ClinicScope::requireUser(), which re-checks that the target belongs to the
# caller's clinic.

headless_patients.phases:
  path: '/api/headless/patients/phases'
  defaults:
    _controller: '\Drupal\headless_patients\Controller\PatientsController::phases'
  requirements:
    _custom_access: '\Drupal\headless_access\Access\ReadChiropractorAccess::access'
  options:
    _auth: ['cookie']
    no_cache: TRUE
  methods: [GET]

