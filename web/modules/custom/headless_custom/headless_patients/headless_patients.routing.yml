    no_cache: TRUE
  methods: [POST]

## The clinic's one permanent intake link.
##
## These live here rather than in headless_intake because they need ClinicScope,
## which this module owns, and this module already depends on headless_intake. The
## token storage itself is still headless_intake's, injected as
## `headless_intake.clinic_link`.
##
## The gate is ManageIntakeLinkAccess rather than the read/write pair used above,
## because these are the only headless endpoints an administrator may reach: a
## clinic whose chiropractor has lost their account still needs a link, and no other
## portal route lets staff act on a clinic they do not belong to. It does not widen
## anything for a chiropractor, who stays scoped to their own clinic.
##
## No clinic appears in any path. A chiropractor's clinic comes from their own
## account; an administrator names one with ?clinic=.
headless_patients.intake_link_show:
  path: '/api/intake-link'
  defaults:
    _controller: '\Drupal\headless_patients\Controller\ClinicIntakeLinkController::show'
  requirements:
    _custom_access: '\Drupal\headless_access\Access\ManageIntakeLinkAccess::access'
  options:
    _auth: ['cookie']
    no_cache: TRUE
  methods: [GET]

headless_patients.intake_link_create:
  path: '/api/intake-link'
  defaults:
    # createLink, not create: ContainerInjectionInterface already claims create()
    # for the service factory, and a method cannot be both.
    _controller: '\Drupal\headless_patients\Controller\ClinicIntakeLinkController::createLink'
  requirements:
    _custom_access: '\Drupal\headless_access\Access\ManageIntakeLinkAccess::access'
  options:
    _auth: ['cookie']
    no_cache: TRUE
  methods: [POST]

## Separate path rather than an action on the create path, because losing the old
## token is destructive and should not be reachable by a retry of the create call.
headless_patients.intake_link_regenerate:
  path: '/api/intake-link/regenerate'
  defaults:
    _controller: '\Drupal\headless_patients\Controller\ClinicIntakeLinkController::regenerate'
  requirements:
    _custom_access: '\Drupal\headless_access\Access\ManageIntakeLinkAccess::access'
  options:
    _auth: ['cookie']
    no_cache: TRUE
  methods: [POST]
