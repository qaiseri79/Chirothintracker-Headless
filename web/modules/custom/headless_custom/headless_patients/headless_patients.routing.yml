## Write-gated, not read-gated: this is the same path as intake_get with a
## different method, because a submission is one resource. Destroying a patient's
## own words is not a read.
headless_patients.intake_delete:
  path: '/api/headless/patients/intake/{message}'
  defaults:
    _controller: '\Drupal\headless_patients\Controller\PatientsController::intakeDelete'
  requirements:
    _custom_access: '\Drupal\headless_access\Access\WriteChiropractorAccess::access'
    message: '\d+'
  options:
    _auth: ['cookie']
    no_cache: TRUE
  methods: [DELETE]

headless_patients.intake_review:
