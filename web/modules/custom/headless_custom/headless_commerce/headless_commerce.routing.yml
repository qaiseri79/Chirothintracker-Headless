headless_commerce.payment_settings:
  path: '/api/headless/commerce/payment-settings'
  defaults:
    _controller: '\Drupal\headless_commerce\Controller\CommerceController::handle'
    action: payment_settings
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\headless_access\Access\WriteChiropractorAccess::access'
  options:
    no_cache: TRUE

headless_commerce.fulfillment_settings:
  path: '/api/headless/commerce/fulfillment-settings'
  defaults:
    _controller: '\Drupal\headless_commerce\Controller\CommerceController::handle'
    action: fulfillment_settings
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\headless_access\Access\WriteChiropractorAccess::access'
  options:
    no_cache: TRUE

headless_commerce.catalog:
  path: '/api/headless/commerce/catalog'
  defaults:
    _controller: '\Drupal\headless_commerce\Controller\CommerceController::handle'
    action: catalog_read
  methods: [GET]
  requirements:
    _custom_access: '\Drupal\headless_access\Access\WriteChiropractorAccess::access'
  options:
    no_cache: TRUE

headless_commerce.catalog_override:
