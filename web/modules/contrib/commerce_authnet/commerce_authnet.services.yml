services:
  commerce_authnet.logger:
    class: Drupal\Core\Logger\LoggerChannel
    factory: logger.factory:get
    arguments: ['commerce_authnet']

  commerce_authnet.echeck_transaction_verifier:
    class: Drupal\commerce_authnet\EcheckTransactionVerifier
    arguments: ['@entity_type.manager', '@commerce_authnet.logger', '@datetime.time']

  commerce_authnet.payment_gateway_utility:
    class: Drupal\commerce_authnet\PaymentGatewayUtility
    arguments:
      - '@commerce_order.adjustment_transformer'

  commerce_authnet.kernel_event_subscriber:
    class: Drupal\commerce_authnet\EventSubscriber\KernelEventSubscriber
    tags:
      - { name: event_subscriber }
