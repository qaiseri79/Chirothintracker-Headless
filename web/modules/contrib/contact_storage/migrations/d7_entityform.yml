id: d7_entityform
label: D8 Contact message migration from D7 entityform submission
migration_tags:
  - Drupal 7
  - Content
deriver: Drupal\contact_storage\Plugin\migrate\D7EntityformDeriver           
source:
  plugin: d7_entityform
  constants:
    langcode: en
    module: contact_storage
process:
  id: entityform_id
  contact_form: type
  uid: uid
  created: created
  changed: changed
  langcode:
    plugin: default_value
    source: language
    default_value: "en"
  dependencies/module/[]: constants/module
destination:
  plugin: entity:contact_message
migration_dependencies:
  required:
    - d7_entityform_type
  optional:
    - d7_field_instance