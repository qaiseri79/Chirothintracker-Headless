<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChiroThin — Resources</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      canvas: "#F3F4F1", surface: "#FFFFFF", ink: "#101827", muted: "#6B7280", line: "#E4E2DC",
      primary: { DEFAULT: "#0B5D52", soft: "#E4EEEC", dark: "#08423A" },
      accent: { DEFAULT: "#C7522A", soft: "#F6E4DC" },
      success: { DEFAULT: "#3D8361", soft: "#E4F0E9" },
    },
    fontFamily: { serif: ["Newsreader","Georgia","serif"], sans: ["Inter","system-ui","sans-serif"] },
    boxShadow: { panel: "0 1px 2px rgba(16,24,39,0.04), 0 8px 24px -12px rgba(16,24,39,0.08)" },
  } } };
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #E4E2DC; border-radius: 8px; }
</style>
</head>
<body class="bg-canvas font-sans text-ink antialiased h-full">
<div class="flex h-full">
  <aside class="group/sidebar hidden md:flex w-[72px] shrink-0 flex-col overflow-hidden border-r border-line bg-surface transition-[width] duration-200 hover:w-64">
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-5">
      <svg class="h-6 w-6 shrink-0 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <div class="whitespace-nowrap opacity-0 transition-opacity duration-150 group-hover/sidebar:opacity-100"><p class="font-serif text-base leading-none text-ink">ChiroThin</p><p class="text-[10px] tracking-wide text-muted">My Account</p></div>
    </div>
    <nav id="nav" class="flex-1 space-y-0.5 px-3 py-4"></nav>
  </aside>
  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-30 flex h-16 items-center gap-4 border-b border-line bg-surface/90 px-6 backdrop-blur">
      <button class="md:hidden rounded-lg p-2 text-muted hover:bg-canvas"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="flex-1"></div>
      <div class="flex items-center gap-2 border-l border-line pl-4"><div class="h-8 w-8 overflow-hidden rounded-full border border-line bg-accent-soft"><img src="https://i.pravatar.cc/64?u=tammy" class="h-full w-full object-cover" /></div><span class="hidden text-sm font-medium text-ink xl:block">Tammy Wahlert</span></div>
    </header>

    <main class="flex-1 overflow-y-auto px-6 py-6 lg:px-8 lg:py-8">
      <div class="mx-auto max-w-4xl space-y-6">
        <div><h1 class="font-serif text-2xl text-ink">Resources</h1><p class="mt-1 text-sm text-muted">Guides, manuals, and reference documents for your program.</p></div>

        <div class="rounded-xl border border-line bg-surface p-5 shadow-panel">
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div class="sm:col-span-2"><label class="mb-1.5 block text-xs font-medium text-muted">Search Resources</label><input id="searchInput" type="text" placeholder="Search documents..." class="w-full rounded-lg border border-line bg-canvas px-3.5 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary" /></div>
            <div><label class="mb-1.5 block text-xs font-medium text-muted">Category</label><select id="categorySelect" class="w-full rounded-lg border border-line bg-canvas px-3.5 py-2.5 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary"><option value="">- Any -</option></select></div>
          </div>
        </div>

        <div id="groups" class="space-y-8"></div>
      </div>
    </main>
  </div>
</div>

<div id="viewer" class="fixed inset-0 z-50 hidden items-center justify-center bg-ink/50 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
  <div class="flex h-full max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl border border-line bg-surface shadow-panel">
    <div class="flex items-center gap-3 border-b border-line px-5 py-3">
      <div class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-accent-soft text-accent"></div>
      <div class="min-w-0 flex-1"><p id="viewerTitle" class="truncate font-medium text-ink"></p><p id="viewerFile" class="truncate text-xs text-muted"></p></div>
      <button id="viewerDownload" title="Download" aria-label="Download" class="rounded-lg p-2 text-muted transition-colors hover:bg-primary-soft hover:text-primary"></button>
      <button id="viewerClose" title="Close" aria-label="Close" class="rounded-lg p-2 text-muted transition-colors hover:bg-canvas hover:text-ink"></button>
    </div>
    <div id="viewerBody" class="flex-1 bg-canvas"></div>
  </div>
</div>

<script>
const ICONS = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2M7 2v20M17 2v20M17 2c-2.5 0-4 3-4 6.5S14.5 15 17 15"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  grad:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/>',
  scale:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v4l2.5 2.5"/>',
  trending:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-8.42H5.12"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  file:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
};
function icon(n,c){return `<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;}
const NAV = [
  {label:"Home",icon:"home"},{label:"Recipes",icon:"utensils"},{label:"Resources",icon:"wrench",active:true},{label:"Training",icon:"grad"},
  {label:"Log My Weight",icon:"scale"},{label:"My Progress",icon:"trending"},{label:"Messages",icon:"message"},{label:"Shop",icon:"cart"},{label:"Extras",icon:"more"},
];
document.getElementById('nav').innerHTML = NAV.map(i=>`
  <a href="#" class="relative flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-sm font-medium transition-colors ${i.active?'bg-primary text-white':'text-ink/70 hover:bg-primary-soft hover:text-primary'}">
    ${icon(i.icon,'h-[18px] w-[18px] shrink-0')}<span class="flex-1 whitespace-nowrap opacity-0 transition-opacity duration-150 group-hover/sidebar:opacity-100">${i.label}</span>
  </a>`).join('');

const RESOURCES = [
  { group:"Documents", title:"*NEW* ChiroThin Instruction Manual", file:"ChiroThin Instruction Manual - Nov 2021.pdf", size:"200.33 KB" },
  { group:"Documents", title:"5000 Calorie Loading Day Samples", file:"ChiroThin Loading Day Examples 2026.pdf", size:"364.52 KB" },
  { group:"Documents", title:"ChiroBurst Training - Weight Maintenance Strategy", file:"chiroburst-training.pdf", size:"809.63 KB" },
  { group:"Documents", title:"ChiroThin Approved Lotions/Moisturizers", file:"ChiroThin Safe Moisturizer.pdf", size:"88.93 KB" },
  { group:"Documents", title:"ChiroThin Restaurant Guide", file:"ChiroThin Restaurant Guide_0.pdf", size:"387.11 KB" },
  { group:"Documents", title:"ChiroThin Weight Loss Program Approved Foods List", file:"ChiroThin Weight Loss Program Approved Foods List.pdf", size:"83.95 KB" },
  { group:"Documents", title:"CRuSH Technique - Self Help for Cravings, Stalls and Hunger", file:"CRuSH Technique.pdf", size:"2.16 MB" },
  { group:"Documents", title:"Locking Phase (Cycling / Maintenance)", file:"Locking Phase.pdf", size:"48.67 KB" },
  { group:"Documents", title:"Putting ChiroThinTracker Icon on a Mobile Device", file:"Icon to Home Screen Instructions.pdf", size:"485.17 KB" },
  { group:"Documents", title:"Recommendations for Vegetarians", file:"Recommendations for Vegetarians.pdf", size:"58.02 KB" },
  { group:"Documents, Guides", title:"Fast Food List", file:"20240602_114740.pdf", size:"387.11 KB" },
  { group:"Documents, Guides", title:"Quick Start Guide", file:"Patient.Quick_.Start_.Guide_.v4.pdf", size:"926.73 KB" },
];

const groupsList = [...new Set(RESOURCES.map(r=>r.group))];
document.getElementById('categorySelect').innerHTML += groupsList.map(g=>`<option value="${g}">${g}</option>`).join('');

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('categorySelect').value;
  const filtered = RESOURCES.filter(r => r.title.toLowerCase().includes(q) && (!cat || r.group===cat));
  const groups = {};
  filtered.forEach(r => (groups[r.group] = groups[r.group] || []).push(r));
  const keys = Object.keys(groups);
  const el = document.getElementById('groups');
  if (keys.length===0) { el.innerHTML = `<p class="py-10 text-center text-sm text-muted">No resources match your search.</p>`; return; }
  el.innerHTML = keys.map(g => `
    <div>
      <h2 class="mb-3 font-serif text-xl text-ink">${g}</h2>
      <div class="space-y-2">
        ${groups[g].map(r => `
        <div class="flex items-center gap-4 rounded-xl border border-line bg-surface px-5 py-4 shadow-panel">
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-accent-soft text-accent">${icon('file','h-5 w-5')}</div>
          <div class="min-w-0 flex-1">
            <p class="truncate font-medium text-ink">${r.title}</p>
            <p class="truncate text-xs text-muted">${r.file}</p>
          </div>
          <span class="hidden shrink-0 text-xs text-muted sm:block">${r.size}</span>
          <div class="flex shrink-0 items-center gap-1">
            <button data-action="view" data-idx="${RESOURCES.indexOf(r)}" title="View" aria-label="View ${r.title}" class="rounded-lg p-2 text-muted transition-colors hover:bg-primary-soft hover:text-primary">${icon('eye','h-4 w-4')}</button>
            <button data-action="download" data-idx="${RESOURCES.indexOf(r)}" title="Download" aria-label="Download ${r.title}" class="rounded-lg p-2 text-muted transition-colors hover:bg-primary-soft hover:text-primary">${icon('download','h-4 w-4')}</button>
          </div>
        </div>`).join('')}
      </div>
    </div>`).join('');
}
['searchInput','categorySelect'].forEach(id => document.getElementById(id).addEventListener('input', render));
render();

const viewer=document.getElementById('viewer');
document.querySelector('#viewer .bg-accent-soft').innerHTML=icon('file','h-5 w-5');
document.getElementById('viewerDownload').innerHTML=icon('download','h-4 w-4');
document.getElementById('viewerClose').innerHTML=icon('x','h-4 w-4');
let current=null;
function openViewer(i){
  const r=RESOURCES[i]; current=r;
  document.getElementById('viewerTitle').textContent=r.title;
  document.getElementById('viewerFile').textContent=r.file+' · '+r.size;
  document.getElementById('viewerBody').innerHTML = r.url
    ? `<iframe src="${r.url}" title="${r.title}" class="h-full w-full border-0"></iframe>`
    : `<div class="flex h-full flex-col items-center justify-center gap-3 p-8 text-center"><div class="flex h-14 w-14 items-center justify-center rounded-xl bg-accent-soft text-accent">${icon('file','h-7 w-7')}</div><p class="font-serif text-lg text-ink">Preview not available</p><p class="max-w-xs text-sm text-muted">Add a <code>url</code> to this resource and the PDF will display here.</p></div>`;
  viewer.classList.remove('hidden'); viewer.classList.add('flex');
}
function closeViewer(){ viewer.classList.add('hidden'); viewer.classList.remove('flex'); document.getElementById('viewerBody').innerHTML=''; current=null; }
function downloadResource(r){ if(!r||!r.url) return; const a=document.createElement('a'); a.href=r.url; a.download=r.file; a.click(); }
document.getElementById('groups').addEventListener('click',e=>{
  const b=e.target.closest('button[data-action]'); if(!b) return;
  const i=+b.dataset.idx;
  b.dataset.action==='view' ? openViewer(i) : downloadResource(RESOURCES[i]);
});
document.getElementById('viewerClose').addEventListener('click',closeViewer);
document.getElementById('viewerDownload').addEventListener('click',()=>downloadResource(current));
viewer.addEventListener('click',e=>{ if(e.target===viewer) closeViewer(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && !viewer.classList.contains('hidden')) closeViewer(); });
</script>
</body>
</html>
