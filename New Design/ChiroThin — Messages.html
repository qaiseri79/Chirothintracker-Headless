<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ChiroThin — Messages</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: {
    colors: {
      canvas: "#F3F4F1", surface: "#FFFFFF", ink: "#101827", muted: "#6B7280", line: "#E4E2DC",
      primary: { DEFAULT: "#0B5D52", soft: "#E4EEEC", dark: "#08423A" },
      accent: { DEFAULT: "#C7522A", soft: "#F6E4DC" },
    },
    fontFamily: { serif: ["Newsreader","Georgia","serif"], sans: ["Inter","system-ui","sans-serif"] },
    boxShadow: { panel: "0 1px 2px rgba(16,24,39,0.04), 0 8px 24px -12px rgba(16,24,39,0.08)" },
  } } };
</script>
<style>
  :root { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html, body { height: 100%; }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #E4E2DC; border-radius: 8px; }
  #pane.dragging #dropOverlay { display: flex; }
</style>
</head>
<body class="bg-canvas font-sans text-ink antialiased h-full">
<div class="flex h-full">
  <aside class="group/sidebar hidden md:flex w-[72px] shrink-0 flex-col overflow-hidden border-r border-line bg-surface transition-[width] duration-200 hover:w-64">
    <div class="flex h-16 shrink-0 items-center gap-3 border-b border-line px-5">
      <svg class="h-6 w-6 shrink-0 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      <div class="whitespace-nowrap opacity-0 transition-opacity group-hover/sidebar:opacity-100"><p class="font-serif text-base leading-none">ChiroThin</p><p class="text-[10px] tracking-wide text-muted">My Account</p></div>
    </div>
    <nav id="nav" class="flex-1 space-y-0.5 px-3 py-4"></nav>
  </aside>

  <div class="flex min-w-0 flex-1 flex-col">
    <header class="sticky top-0 z-30 flex h-16 shrink-0 items-center gap-4 border-b border-line bg-surface/90 px-6 backdrop-blur">
      <h1 class="font-serif text-lg">Messages</h1>
      <div class="flex-1"></div>
      <div id="viewSwitch" class="flex rounded-lg border border-dashed border-line p-0.5 text-[11px] font-medium" title="Design preview only"></div>
      <div class="flex items-center gap-2 border-l border-line pl-4"><div class="flex h-8 w-8 items-center justify-center rounded-full border border-line bg-accent-soft text-[11px] font-semibold text-accent">EM</div><span class="hidden text-sm font-medium xl:block">Erik Madsen</span></div>
    </header>

    <div id="pane" class="relative flex min-w-0 flex-1 flex-col overflow-hidden">
      <!-- Thread header -->
      <div class="flex items-center gap-3 border-b border-line bg-surface px-6 py-3.5">
        <div class="flex h-10 w-10 items-center justify-center rounded-full border border-line bg-primary-soft text-xs font-semibold text-primary">TR</div>
        <div class="min-w-0 flex-1"><p class="text-sm font-semibold">Dr. Todd Reese</p><p class="text-xs text-muted">Your ChiroThin provider</p></div>
        <span id="unreadBadge" class="hidden rounded-full bg-accent px-2 py-0.5 text-[11px] font-semibold text-white"></span>
        <div class="relative w-44 sm:w-64">
          <svg class="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input id="search" type="text" placeholder="Search messages & files..." class="w-full rounded-lg border border-line bg-canvas py-2 pl-9 pr-3 text-sm focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary disabled:opacity-50" />
        </div>
      </div>

      <div id="thread" class="flex-1 overflow-y-auto px-6 py-6"></div>

      <!-- Composer -->
      <div class="border-t border-line bg-surface p-4">
        <div class="mx-auto max-w-3xl">
          <div class="rounded-xl border border-line bg-canvas focus-within:border-primary focus-within:ring-1 focus-within:ring-primary">
            <div id="staged" class="hidden flex-wrap gap-2 p-2.5 pb-0"></div>
            <div class="flex items-end gap-1.5 p-2">
              <input id="fileInput" type="file" multiple class="hidden" accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.heic,.doc,.docx,.xls,.xlsx,.csv,.txt" />
              <button id="attachBtn" aria-label="Attach files" title="Attach files" class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-muted hover:bg-primary-soft hover:text-primary">
                <svg class="h-[18px] w-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                <span id="attachCount" class="absolute -right-0.5 -top-0.5 hidden h-4 min-w-4 items-center justify-center rounded-full bg-primary px-1 text-[10px] font-semibold text-white"></span>
              </button>
              <textarea id="replyBox" rows="1" placeholder="Write a message..." class="max-h-32 flex-1 resize-none bg-transparent px-2 py-2 text-sm focus:outline-none"></textarea>
              <button id="sendBtn" aria-label="Send" class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-primary text-white hover:bg-primary-dark">
                <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
          <div class="mt-1.5 flex items-center justify-between gap-3 px-1 text-[11px]">
            <p id="err" class="hidden text-accent"></p>
            <p id="hint" class="text-muted">Attach up to 10 files · 10 MB each · PDF, images, Word, Excel, text. Drag &amp; drop works too.</p>
          </div>
        </div>
      </div>

      <div id="dropOverlay" class="pointer-events-none absolute inset-0 z-20 hidden items-center justify-center bg-primary/10 backdrop-blur-[1px]">
        <div class="m-4 flex h-[calc(100%-2rem)] w-[calc(100%-2rem)] flex-col items-center justify-center rounded-2xl border-2 border-dashed border-primary bg-surface/80 text-center">
          <p class="font-serif text-xl text-primary">Drop files to attach</p>
          <p class="mt-1 text-sm text-muted">You can add several at once</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const ICONS = {
  home:'<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h2a2 2 0 0 0 2-2V2M7 2v20M17 2v20M17 2c-2.5 0-4 3-4 6.5S14.5 15 17 15"/>',
  wrench:'<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/>',
  grad:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 3 3 6 3s6-2 6-3v-5"/>',
  scale:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M12 8v4l2.5 2.5"/>',
  trending:'<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
  message:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  cart:'<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 2-1.58l1.65-8.42H5.12"/>',
  more:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
};
const icon=(n,c)=>`<svg class="${c}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]}</svg>`;
const NAV=[["Home","home"],["Recipes","utensils"],["Resources","wrench"],["Training","grad"],["Log My Weight","scale"],["My Progress","trending"],["Messages","message",1],["Shop","cart"],["Extras","more"]];
document.getElementById('nav').innerHTML=NAV.map(([l,i,a])=>`<a href="#" class="flex items-center gap-3 rounded-lg px-2.5 py-2.5 text-sm font-medium ${a?'bg-primary text-white':'text-ink/70 hover:bg-primary-soft hover:text-primary'}">${icon(i,'h-[18px] w-[18px] shrink-0')}<span class="whitespace-nowrap opacity-0 transition-opacity group-hover/sidebar:opacity-100">${l}</span></a>`).join('');

/* ---- Attachment rules ---- */
const MAX_FILES=10, MAX_BYTES=10*1024*1024;
const KINDS={pdf:['PDF','bg-red-600'],img:['IMG','bg-accent'],doc:['DOC','bg-blue-600'],xls:['XLS','bg-emerald-600'],txt:['TXT','bg-slate-500']};
const kindOf=n=>{const e=(n.split('.').pop()||'').toLowerCase();
  if(e==='pdf')return'pdf'; if(['jpg','jpeg','png','gif','webp','heic'].includes(e))return'img';
  if(['doc','docx'].includes(e))return'doc'; if(['xls','xlsx','csv'].includes(e))return'xls';
  if(e==='txt')return'txt'; return null;};
const fmtSize=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';
const badge=(k,cls='')=>`<span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-[10px] font-bold tracking-wide text-white ${KINDS[k][1]} ${cls}">${KINDS[k][0]}</span>`;

/* ---- Data adapter: swap these with your Drupal endpoints ---- */
const SAMPLE=[
 {from:"doctor",time:"Wed, 09/16 · 11:56",text:`Constipation can be a real challenge with weight loss, and yet regular bowel movements are essential to losing weight. Since you've indicated constipation as a flag, here's a list of things you can try:\n\n• Start your day with a warm beverage\n• Drink plenty of water throughout the day\n• Get adequate sleep\n• Drink a flushing tea before bed, like Yogi Smooth Move or ChiroKlenz – Senna\n• Eat cherries, berries, pears, plums, apples or kiwi\n• Eat broccoli, brussels sprouts, kale and spinach\n• Move your body — gentle exercise\n• Elevate your feet on a step stool while on the toilet\n• Take a good digestive enzyme at the beginning of each meal\n\nAvoid: sitting for long periods, skipping meals, stress, and too much caffeine. Message us if you'd like a supplement recommendation.`},
 {from:"doctor",time:"Wed, 09/16 · 12:00",text:"Make an appointment to come in Monday or Tuesday next week for you and Debbie. (208) 227-0400\n\nTodd"},
 {from:"patient",time:"Wed, 09/16 · 16:53",text:"Will do. I'm also feeling great today."},
 {from:"patient",time:"Sun, 09/20 · 07:30",text:"Super busy day yesterday helping wire my son-in-law's house and then walked 18 holes of golf with the sons. I increased lean protein to 10 oz to offset the calorie deficit from the extra activity. I'm also experiencing lack of bowel movement the past 2 days — I'll focus on that today."},
 {from:"patient",time:"Tue, 09/22 · 08:30",text:"My weight loss appears to have plateaued, as you said it would. Any recommendations beyond following the protocol that I should consider?"},
 {from:"patient",time:"Wed, 09/23 · 11:07",text:"Hey Todd. Can you also send me the blast formula when you send it to Debbie. Thanks!"},
 {from:"doctor",time:"Wed, 09/23 · 21:22",text:"I just got that sent to Debbie."},
 {from:"patient",time:"Wed, 09/23 · 21:39",text:"Thanks"},
 {from:"patient",time:"Fri, 09/25 · 08:36",text:"Hi Todd, can you or your staff enter into the system my beginning measurements? I'm curious what my loss in inches has been so far. Thanks!"},
 {from:"patient",time:"Fri, 09/25 · 08:41",text:"Also attaching my latest lab work and food log for review.",files:[{name:"Lab-Results-Sept.pdf",size:482113,kind:"pdf"},{name:"Food-Log-Week-3.xlsx",size:38210,kind:"xls"},{name:"Beginning-Measurements.jpg",size:1284900,kind:"img"}]},
];
const fresh=()=>SAMPLE.map((m,i)=>({...m,id:i+1,isNew:m.from==='doctor'&&i>0}));
let MESSAGES=fresh(), view='messages', nextId=100, STAGED=[], stagedId=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const STARTERS=["Ask about my protocol","Question about my measurements","Recommend a supplement","Schedule an appointment","Send documents"];
const STARTER_TEXT=["Hi Dr. Reese, I have a question about my protocol: ","Hi Dr. Reese, I have a question about my measurements: ","Hi Dr. Reese, could you recommend a supplement for ","Hi Dr. Reese, I'd like to schedule an appointment. ","Hi Dr. Reese, attaching some documents for your review: "];

function emptyState(){
  return `<div class="mx-auto flex h-full max-w-md flex-col items-center justify-center text-center">
    <div class="mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-primary-soft text-primary">${icon('message','h-7 w-7')}</div>
    <h2 class="font-serif text-xl">Start your conversation with Dr. Reese</h2>
    <p class="mt-2 text-sm leading-relaxed text-muted">No messages yet. Send a note about your progress, ask a question, or share lab results and other documents. Your provider's replies will appear here.</p>
    <div class="mt-6 flex flex-wrap justify-center gap-2">
      ${STARTERS.map((s,i)=>`<button data-starter="${i}" class="rounded-full border border-line bg-surface px-3.5 py-1.5 text-xs font-medium text-ink/80 shadow-panel hover:border-primary hover:text-primary">${s}</button>`).join('')}
    </div>
  </div>`;
}
const TICKS='<svg class="h-3.5 w-3.5 text-primary" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12.5l4.5 4.5L15 8.5"/><path d="M11 15.5l1.5 1.5L21 8.5"/></svg>';

function filesHtml(files){
  const imgs=files.filter(f=>f.kind==='img'&&f.url), rest=files.filter(f=>!(f.kind==='img'&&f.url));
  const tag=(f,inner,cls)=>f.url?`<a href="${f.url}" download="${esc(f.name)}" target="_blank" rel="noopener" class="${cls}">${inner}</a>`:`<div class="${cls}">${inner}</div>`;
  const grid=imgs.length?`<div class="mb-2 grid gap-1.5 ${imgs.length>1?'grid-cols-2':'grid-cols-1'}">${imgs.map(f=>`<a href="${f.url}" target="_blank" rel="noopener"><img src="${f.url}" alt="${esc(f.name)}" class="h-32 w-full rounded-lg object-cover"/></a>`).join('')}</div>`:'';
  const list=rest.map(f=>tag(f,`${badge(f.kind)}<span class="min-w-0"><span class="block truncate text-[13px] font-medium">${esc(f.name)}</span><span class="block text-[11px] opacity-70">${fmtSize(f.size)}</span></span>`,'flex items-center gap-2.5 rounded-lg bg-black/[0.06] px-2.5 py-2 hover:bg-black/10 [.bg-primary_&]:bg-white/15')).join('');
  return `<div class="mt-2.5 space-y-1.5">${grid}${list}</div>`;
}
function bubbles(){
  const q=$('search').value.trim().toLowerCase();
  const rows=MESSAGES.filter(m=>!q||m.text.toLowerCase().includes(q)||(m.files||[]).some(f=>f.name.toLowerCase().includes(q)));
  if(!rows.length) return `<p class="mt-16 text-center text-sm text-muted">No messages match "${esc(q)}".</p>`;
  return `<div class="mx-auto max-w-3xl space-y-4">`+rows.map(m=>`
    <div class="flex ${m.from==='patient'?'justify-end':'justify-start'}">
      <div class="max-w-[85%] sm:max-w-[70%]">
        <div class="rounded-2xl px-4 py-3 text-sm leading-relaxed ${m.from==='patient'
          ?'bg-primary text-white rounded-br-sm'
          :'border bg-surface text-ink rounded-bl-sm shadow-panel '+(m.isNew?'border-accent ring-1 ring-accent/30':'border-line')}">
          ${m.text?`<div class="whitespace-pre-line">${esc(m.text)}</div>`:''}
          ${m.files&&m.files.length?filesHtml(m.files):''}
        </div>
        <div class="mt-1 flex items-center gap-2 text-[11px] text-muted ${m.from==='patient'?'justify-end':''}">
          <span>${m.time}</span>
          ${m.files&&m.files.length?`<span class="text-line">·</span><span>${m.files.length} file${m.files.length>1?'s':''}</span>`:''}
          ${m.from==='doctor'?(m.isNew
            ?`<span class="text-line">·</span><button data-id="${m.id}" class="rounded-full border border-accent/40 px-2 py-0.5 text-[11px] font-medium text-accent hover:bg-accent hover:text-white">Mark as read</button>`
            :`<span class="text-line">·</span><span class="flex items-center gap-1" title="Read">${TICKS}<span>Read</span></span>`):''}
        </div>
      </div>
    </div>`).join('')+`</div>`;
}
function render(keepScroll){
  const t=$('thread'), prev=t.scrollTop;
  $('search').disabled=!MESSAGES.length;
  t.innerHTML=MESSAGES.length?bubbles():emptyState();
  t.scrollTop=keepScroll?prev:t.scrollHeight;
  const n=MESSAGES.filter(m=>m.isNew).length;
  $('unreadBadge').textContent=n+' new'; $('unreadBadge').classList.toggle('hidden',!n);
  $('viewSwitch').innerHTML=[["messages","With messages"],["empty","No conversation yet"]].map(([k,l])=>`<button data-view="${k}" class="rounded-md px-2.5 py-1 ${view===k?'bg-ink text-white':'text-muted hover:text-ink'}">${l}</button>`).join('');
}

/* ---- Staged attachments ---- */
function showErr(msg){const e=$('err');e.textContent=msg;e.classList.toggle('hidden',!msg);$('hint').classList.toggle('hidden',!!msg);
  clearTimeout(showErr.t); if(msg) showErr.t=setTimeout(()=>showErr(''),6000);}
function renderStaged(){
  const box=$('staged');
  box.classList.toggle('hidden',!STAGED.length); box.classList.toggle('flex',!!STAGED.length);
  box.innerHTML=STAGED.map(s=>`
    <div class="flex max-w-[15rem] items-center gap-2 rounded-lg border border-line bg-surface py-1.5 pl-1.5 pr-1 shadow-panel">
      ${s.kind==='img'?`<img src="${s.url}" alt="" class="h-9 w-9 shrink-0 rounded-lg object-cover"/>`:badge(s.kind)}
      <span class="min-w-0"><span class="block truncate text-xs font-medium">${esc(s.file.name)}</span><span class="block text-[11px] text-muted">${fmtSize(s.file.size)}</span></span>
      <button data-remove="${s.id}" aria-label="Remove ${esc(s.file.name)}" class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-muted hover:bg-accent-soft hover:text-accent">
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>`).join('')
    +(STAGED.length>1?`<button data-clear class="self-center px-1 text-[11px] font-medium text-muted hover:text-accent">Clear all</button>`:'');
  const c=$('attachCount'); c.textContent=STAGED.length; c.classList.toggle('hidden',!STAGED.length); c.classList.toggle('flex',!!STAGED.length);
}
function addFiles(list){
  const errs=[];
  for(const f of list){
    const kind=kindOf(f.name);
    if(!kind){errs.push(`${f.name}: unsupported file type`);continue;}
    if(f.size>MAX_BYTES){errs.push(`${f.name}: larger than 10 MB`);continue;}
    if(f.size===0){errs.push(`${f.name}: file is empty`);continue;}
    if(STAGED.some(s=>s.file.name===f.name&&s.file.size===f.size)){errs.push(`${f.name}: already added`);continue;}
    if(STAGED.length>=MAX_FILES){errs.push(`Limit of ${MAX_FILES} files per message reached`);break;}
    STAGED.push({id:++stagedId,file:f,kind,url:URL.createObjectURL(f)});
  }
  renderStaged(); showErr(errs.slice(0,2).join(' · ')+(errs.length>2?` · +${errs.length-2} more`:''));
}
function removeStaged(id){const i=STAGED.findIndex(s=>s.id===id); if(i>-1){URL.revokeObjectURL(STAGED[i].url);STAGED.splice(i,1);} renderStaged(); showErr('');}

function send(){
  const text=$('replyBox').value.trim(); if(!text&&!STAGED.length) return;
  const d=new Date(), p=n=>String(n).padStart(2,'0'), days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const files=STAGED.map(s=>({name:s.file.name,size:s.file.size,kind:s.kind,url:s.url}));
  view='messages'; MESSAGES.push({id:nextId++,from:"patient",isNew:false,text,files,time:`${days[d.getDay()]}, ${p(d.getMonth()+1)}/${p(d.getDate())} · ${p(d.getHours())}:${p(d.getMinutes())}`});
  STAGED=[]; renderStaged(); showErr('');
  $('replyBox').value=''; $('replyBox').style.height='auto'; render(false);
}
$('sendBtn').onclick=send;
$('attachBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{addFiles([...e.target.files]); e.target.value='';};
$('replyBox').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
$('replyBox').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,128)+'px';});
$('replyBox').addEventListener('paste',e=>{const fs=[...(e.clipboardData?.files||[])]; if(fs.length){e.preventDefault();addFiles(fs);}});
$('staged').addEventListener('click',e=>{
  const r=e.target.closest('[data-remove]'); if(r) return removeStaged(+r.dataset.remove);
  if(e.target.closest('[data-clear]')){[...STAGED].forEach(s=>URL.revokeObjectURL(s.url));STAGED=[];renderStaged();showErr('');}
});
$('thread').addEventListener('click',e=>{
  const st=e.target.closest('[data-starter]');
  if(st){const i=+st.dataset.starter; $('replyBox').value=STARTER_TEXT[i]; $('replyBox').focus(); if(i===4)$('fileInput').click(); return;}
  const b=e.target.closest('button[data-id]'); if(!b) return;
  MESSAGES.find(x=>x.id==b.dataset.id).isNew=false; render(true);
});
$('search').oninput=()=>render(true);
$('viewSwitch').onclick=e=>{const b=e.target.closest('[data-view]'); if(!b) return;
  view=b.dataset.view; MESSAGES=view==='empty'?[]:fresh(); $('search').value=''; $('replyBox').value=''; render(false);};

/* Drag & drop anywhere over the conversation pane */
const pane=$('pane'); let dragDepth=0;
const hasFiles=e=>[...(e.dataTransfer?.types||[])].includes('Files');
pane.addEventListener('dragenter',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth++;pane.classList.add('dragging');});
pane.addEventListener('dragover',e=>{if(hasFiles(e))e.preventDefault();});
pane.addEventListener('dragleave',()=>{dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)pane.classList.remove('dragging');});
pane.addEventListener('drop',e=>{if(!hasFiles(e))return;e.preventDefault();dragDepth=0;pane.classList.remove('dragging');addFiles([...e.dataTransfer.files]);});

render(false);
</script>
</body>
</html>
