 <div id="newRow" class="hidden gap-2"><input id="ttl" placeholder="Name it, e.g. Fasting reminder" class="${INP}"><button id="saveT" class="shrink-0 rounded-lg bg-primary px-3 text-sm font-semibold text-white hover:bg-primary-dark">Save to my list</button></div>`,'Send notification',o=>toast(v(o,'msg').trim()?'Notification sent to '+p.name:'Nothing to send'),'max-w-xl');
 const g=o.querySelector('#grid'),m=o.querySelector('#msg'),nr=o.querySelector('#newRow'),all=()=>[...DEF,...CUSTOM];
 const draw=()=>{g.innerHTML=all().map(([i,t,x],k)=>`<div class="relative"><button data-k="${k}" class="flex h-full w-full items-start gap-2.5 rounded-lg border px-3 py-2.5 text-left hover:border-primary ${String(k)===sel?'border-primary bg-primary-soft':'border-line'}"><span class="mt-0.5 text-primary">${ic(i)}</span><span class="min-w-0 pr-4"><span class="block text-sm font-semibold">${t}</span><span class="line-clamp-2 block text-[11px] font-normal text-muted">${x.replace(/\{name\}/g,f)}</span></span></button>${k>=DEF.length?`<button data-del="${k}" title="Delete" class="absolute right-1.5 top-1.5 rounded p-1 text-xs text-muted hover:text-red-600">✕</button>`:''}</div>`).join('')+`<button data-k="new" class="flex items-center justify-center gap-2 rounded-lg border border-dashed border-primary/50 px-3 py-2.5 text-sm font-semibold text-primary hover:bg-primary-soft">${ic('edit')}New notification</button>`};
 g.onclick=e=>{const d=e.target.closest('[data-del]');if(d){CUSTOM.splice(+d.dataset.del-DEF.length,1);sel=null;draw();return}
  const b=e.target.closest('[data-k]');if(!b)return;sel=b.dataset.k;m.value=sel=='new'?'':all()[sel][2].replace(/\{name\}/g,f);nr.classList.toggle('hidden',sel!='new');nr.classList.toggle('flex',sel=='new');draw();m.focus()};
 o.querySelector('#saveT').onclick=()=>{const t=o.querySelector('#ttl').value.trim(),x=m.value.trim();if(!t||!x)return toast('Add a name and a message first');
  CUSTOM.push(['message',t,x.split(f).join('{name}')]);sel=String(all().length-1);o.querySelector('#ttl').value='';nr.classList.add('hidden');nr.classList.remove('flex');draw();toast('Saved to your notifications')};
 draw()}
const bellMenu=(b,p)=>notify(p);

/* ---------- render ---------- */
function stats(){const n=PATIENTS.filter(p=>p.review=="New").length,a=PATIENTS.length?Math.round(PATIENTS.reduce((s,p)=>s+pct(p),0)/PATIENTS.length):0;
 $('#stats').innerHTML=[["Patients enrolled",PATIENTS.length],["Needs review",n],["Avg. % of goal",a+"%"],["Total weight lost",PATIENTS.reduce((s,p)=>s+p.stats.net,0).toFixed(0)+" lbs"]].map(([l,x])=>`<div class="flex-1 px-6 py-4"><p class="lbl">${l}</p><p class="mt-1 font-serif text-3xl">${x}</p></div>`).join('')}
function filters(){$('#filters').innerHTML=["All","Needs review","Reviewed"].map(f=>`<button data-act="filter" data-arg="${f}" class="rounded-full px-3.5 py-1.5 text-sm font-medium ${S.f==f?'bg-primary text-white':'border border-line bg-surface text-ink/70 hover:bg-primary-soft'}">${f}</button>`).join('')}
const comm=(k,i,d,pg,id)=>`<div class="flex flex-col rounded-lg border border-line p-3.5"><div class="flex items-center justify-between"><span class="flex items-center gap-2 text-sm font-semibold text-primary">${ic(i,'h-4 w-4')}${d.count} ${d.count==1?k.slice(0,-1):k}</span><button data-act="go" data-arg="${pg}" class="text-xs font-medium text-primary hover:underline">View all →</button></div>${d.count?`<p class="mt-2 text-[11px] text-muted">Latest · ${d.time}</p><p class="mt-1 line-clamp-2 text-sm leading-relaxed">${d.last}</p><button data-act="readfull" data-k="${k}" data-id="${id}" class="mt-2.5 self-start rounded-md border border-line px-2.5 py-1 text-xs font-medium hover:border-primary hover:text-primary">Read full ${k.slice(0,-1)}</button>`:'<p class="mt-2 text-sm text-muted">Nothing yet.</p>'}</div>`;
function readFull(p,k){const d=p[k];modal(`Latest ${k.slice(0,-1)} — ${p.name}`,`<p class="text-xs text-muted">${d.time}</p><p class="whitespace-pre-line leading-relaxed">${d.last}</p>`,`View all ${k}`,()=>go(k[0].toUpperCase()+k.slice(1)),'max-w-lg','Close')}
const phaseCard=p=>{const sy=p.sysPhase||p.phase,man=p.phase!==sy;return `<div class="flex flex-wrap items-center gap-x-4 gap-y-2"><div><p class="lbl">Program phase</p><button data-act="phase" data-id="${p.id}" class="mt-1 inline-flex items-center gap-2 rounded-lg bg-primary px-3.5 py-2 text-sm font-semibold text-white hover:bg-primary-dark">${p.phase}${ic('chev','h-3.5 w-3.5')}</button></div>
 <p class="max-w-xs text-xs leading-relaxed text-muted">${man?`Set manually by you. System suggests <b class="text-ink">${sy}</b>. <button data-act="syspase" data-id="${p.id}" class="font-medium text-primary underline">Use system phase</button>`:'Assigned automatically from program progress. You can change it any time.'}</p></div>`};
const tile=(l,v_,x='')=>`<div class="rounded-lg border border-line bg-surface px-3 py-2.5"><p class="lbl">${l}</p><p class="mt-0.5 text-sm font-semibold ${x}">${v_}</p></div>`;
const SLEEP=['8:00','7:30','6:45','7:15']; // demo values; use the log's real sleep field
const gc=g=>g>=9?'bg-success':g>=6?'bg-amber-500':'bg-red-600';
const pill=(on,i,t,cls)=>`<span class="inline-flex items-center gap-1 rounded-md px-2 py-1 text-[11px] font-medium ${on?cls:'bg-canvas text-muted/70'}">${ic(i,'h-3 w-3')}${t}</span>`;
const logCard=(l,o)=>{const d=o?l.weight-o.weight:null,lb=l.label&&LABELS[l.label];
 return `<div class="w-60 shrink-0 rounded-xl border border-line border-l-4 ${lb?lb[1].replace('bg-','border-l-'):'border-l-line'} bg-surface p-3.5">
 <div class="flex items-start justify-between"><div><p class="text-sm font-semibold">${l.date}</p><p class="text-[11px] text-muted">Log Day #${l.n}</p></div>
  <div class="text-center" title="Adherence grade"><span class="inline-flex h-8 w-8 items-center justify-center rounded-full text-sm font-bold text-white ${gc(l.grade)}">${l.grade}</span><p class="text-[9px] uppercase tracking-wide text-muted">Adherence</p></div></div>
 <div class="mt-3"><p class="lbl">Weight</p><p class="font-serif text-2xl leading-tight">${l.weight.toFixed(2)} <span class="text-sm text-muted">lbs</span></p>
  <p class="text-xs font-medium ${d===null?'text-muted':d<0?'text-success':d>0?'text-red-600':'text-muted'}">${d===null?'First entry in view':`${d<0?'▼':d>0?'▲':'•'} ${Math.abs(d).toFixed(2)} lbs vs previous log`}</p></div>
 <div class="mt-3 min-h-[24px]">${lb?`<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[11px] font-semibold text-white ${lb[1]}">${lb[0]}</span>`:'<span class="text-[11px] text-muted">No flags</span>'}</div>
 <div class="mt-3 space-y-0.5 text-xs text-muted"><p>Water: <span class="font-semibold text-ink">${l.h2o.toFixed(0)} oz</span></p><p class="flex items-center gap-1">${ic('moon','h-3 w-3 text-sky-600')}Sleep: ${l.sleep?`<span class="font-semibold text-ink">${SLEEP[l.n%4]} hrs</span>`:'not logged'}</p></div>
 <div class="mt-2 flex flex-wrap gap-1.5">${pillB(l.food,'utensils',l.food?'Food'+ic('chev','h-3 w-3'):'No food log','bg-accent-soft text-accent','food',l.n)}${pillB(l.n%2,'arrows',l.n%2?'Measurements'+ic('chev','h-3 w-3'):'No measurements','bg-violet-100 text-violet-700','meas',l.n)}${pill(1,'flag',l.cheat?'Cheated':'On plan',l.cheat?'bg-red-100 text-red-700':'bg-success-soft text-success')}</div></div>`};
const pillB=(on,i,t,cls,act,n)=>on?`<button data-act="${act}" data-n="${n}" class="inline-flex items-center gap-1 rounded-md px-2 py-1 text-[11px] font-medium hover:ring-1 hover:ring-current ${cls}">${ic(i,'h-3 w-3')}${t}</button>`:pill(0,i,t,cls);
const more=p=>p.logs[p.logs.length-1].n>1;
const stripHTML=p=>p.logs.map((l,i)=>logCard(l,p.logs[i+1])).join('')+(more(p)?`<button data-act="more-logs" data-id="${p.id}" data-loader class="flex w-48 shrink-0 items-center justify-center rounded-xl border border-dashed border-line text-xs font-medium text-muted hover:border-primary hover:text-primary">Scroll or click for older logs →</button>`:`<div class="flex w-40 shrink-0 items-center justify-center rounded-xl border border-dashed border-line text-xs text-muted">Start of program</div>`);
const countTxt=p=>`Showing ${p.logs.length} of ${p.logs[0].n} logs`;
const logsBlock=p=>`<div><div class="mb-2 flex flex-wrap items-center gap-x-4 gap-y-1"><p class="text-sm font-semibold">Daily logs</p><p data-count="${p.id}" class="text-xs text-muted">${countTxt(p)}</p>
 <div class="flex flex-wrap gap-x-3 gap-y-1">${Object.values(LABELS).map(([n,c])=>`<span class="flex items-center gap-1 text-[11px] text-muted"><i class="h-2.5 w-2.5 rounded-sm ${c}"></i>${n}</span>`).join('')}</div>
 <div class="ml-auto flex gap-1">${[-1,1].map(d=>`<button data-act="logscroll" data-dir="${d}" data-id="${p.id}" class="rounded-md border border-line bg-surface p-1.5 hover:border-primary" aria-label="Scroll logs">${ic(d<0?'cl':'cr')}</button>`).join('')}</div></div>
 <div data-strip="${p.id}" class="flex gap-3 overflow-x-auto pb-2">${stripHTML(p)}</div>
 <p class="mt-1 text-[11px] text-muted">Newest first. Left border color = flagged reason. Adherence: green 9-10, amber 6-8, red 5 or less.</p></div>`;
const rnd=Math.random,ks=Object.keys(LABELS);
function moreLogs(p){const last=p.logs[p.logs.length-1],out=[];let d=new Date(last.date),w=last.weight;
 for(let i=1;i<=6&&last.n-i>=1;i++){d=new Date(d);d.setDate(d.getDate()-1-Math.floor(rnd()*3));w+=rnd()*1.4;
  out.push(L(last.n-i,d.toLocaleDateString('en-US',{month:'2-digit',day:'2-digit',year:'numeric'}),5+Math.floor(rnd()*6),+w.toFixed(2),90+Math.floor(rnd()*40),rnd()<.25?ks[Math.floor(rnd()*4)]:0,rnd()<.85?1:0,rnd()<.5?1:0,rnd()<.1?1:0))}return out}
function loadMore(s){const p=P(s.dataset.strip);if(s._busy||!more(p))return;s._busy=1;
 const ld=s.querySelector('[data-loader]');ld.textContent='Loading older logs…';ld.classList.add('animate-pulse');
 setTimeout(()=>{const x=s.scrollLeft;p.logs.push(...moreLogs(p)); // Next.js: fetch(`/api/patients/${p.id}/logs?before=${lastLogN}`)
  s.innerHTML=stripHTML(p);s.scrollLeft=x;s._busy=0;$(`[data-count="${p.id}"]`).textContent=countTxt(p)},700)}
const SAMPLE_FOOD={Lunch:{Protein:'Lean Pork Loin',Veg:'Cactus','Free Veg':'Bok Choy, Cabbage',Fruit:'Blueberry, Bilberry, Blackberry',Bread:'Ole Brand Extreme Wellness Tortilla'},Dinner:{Protein:'Ostrich','Free Veg':'Collard Greens, Chives',Fruit:'Damson, Dragon Fruit',Bread:'Flatout Flavor!t'}};
const SAMPLE_MEAS={Neck:'10.00',Shoulders:'9.00',Chest:'8.00',Arms:'10.00 / 10.00',Abdomen:'10.00',Hips:'10.00',Thighs:'10.00 / 10.00',Calves:'10.00 / 10.00'};
function showPop(b,a){const st=b.closest('[data-strip]'),p=P(st.dataset.strip),l=p.logs.find(x=>x.n==b.dataset.n);
 const rows=o=>Object.entries(o).map(([k,x])=>`<div class="flex gap-2 py-0.5"><dt class="w-24 shrink-0 text-xs font-semibold text-accent">${k}</dt><dd class="text-xs">${x}</dd></div>`).join('');
 const body=a=='food'?Object.entries(SAMPLE_FOOD).map(([m,o])=>`<p class="mt-3 text-sm font-semibold">${m}</p><dl>${rows(o)}</dl>`).join('')+`<p class="mt-3 text-sm font-semibold">Other</p><p class="text-xs text-muted">${l.other||'Nothing recorded'}</p>`:`<dl class="mt-2">${rows(SAMPLE_MEAS)}</dl>`;
 closeMenu();const r=b.getBoundingClientRect(),m=document.createElement('div');m.id='menu';m.className='fixed z-50 max-h-[70vh] w-80 overflow-y-auto rounded-xl border border-line bg-surface p-4 shadow-xl';
 m.style.top=Math.max(8,Math.min(r.bottom+4,innerHeight-360))+'px';m.style.left=Math.max(8,Math.min(r.left,innerWidth-336))+'px';
 m.innerHTML=`<p class="lbl">${a=='food'?'Food':'Measurements'} · ${l.date} · Log Day #${l.n}</p>${body}`;document.body.appendChild(m)}
document.addEventListener('scroll',e=>{closeMenu();const s=e.target;if(s.dataset&&s.dataset.strip&&s.scrollLeft+s.clientWidth>=s.scrollWidth-260)loadMore(s)},true);
function detail(p){const s=p.stats;const ab=(i,t,a,x='',cls='border-line bg-surface')=>`<button data-act="${a}" data-id="${p.id}" ${x} class="inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm font-medium hover:border-primary ${cls}">${ic(i,'h-3.5 w-3.5')}${t}</button>`;
return `<div class="space-y-4">
 <div class="rounded-xl border border-line bg-surface p-4"><div class="mb-3 flex flex-wrap items-center gap-2"><p class="lbl">Account</p><span class="inline-flex items-center gap-1.5 text-xs text-muted">${ic('mail','h-3.5 w-3.5')}${p.email}</span><button data-act="phase" data-id="${p.id}" class="ml-auto inline-flex items-center gap-1 rounded-md border border-line px-2.5 py-1 text-xs font-medium xl:hidden">${p.phase}${ic('chev','h-3 w-3')}</button></div>
  <div class="flex flex-wrap gap-2">${ab('edit','Edit account','edit')}${ab('clipboard','Details','go','data-arg="Patient details"')}${ab('scale','Log patient progress','go','data-arg="Log Patient Progress"')}${ab('refresh','Refresh data','refresh')}${ab('mail','Resend welcome e-mail','welcome')}${ab('download','Download messages','dlmsg')}${ab('download','Download logs','dllog')}${ab('archive','Archive patient','archive','','border-red-200 bg-red-50 text-red-700')}</div></div>
 <div class="rounded-xl border border-line bg-surface p-4"><div class="flex flex-wrap items-center justify-between gap-2"><p class="lbl">Messages &amp; notes</p><button data-act="bell" data-id="${p.id}" class="inline-flex items-center gap-2 rounded-lg bg-accent px-4 py-2 text-sm font-semibold text-white hover:opacity-90">${ic('send')}Send notification</button></div>
  <div class="mt-3 grid gap-3 md:grid-cols-2">${comm('messages','message',p.messages,'Messages',p.id)}${comm('notes','note',p.notes,'Notes',p.id)}</div></div>
 <div class="rounded-xl border border-line bg-surface p-4"><p class="lbl">Sessions</p><div class="mt-2 flex flex-wrap items-center gap-2">${p.sessions.map(x=>`<button data-act="go" data-arg="${x.name}" class="inline-flex items-center gap-2 rounded-lg bg-success px-3 py-2 text-xs font-semibold text-white hover:opacity-90">${x.name}<span class="rounded-full bg-white/25 px-1.5">${x.count}</span></button>`).join('')||'<span class="text-sm text-muted">No sessions yet</span>'}<button data-act="session" data-id="${p.id}" title="New session entry" class="flex h-9 w-9 items-center justify-center rounded-lg bg-red-600 text-white hover:bg-red-700">${ic('bolt')}</button></div></div>
 <div class="grid grid-cols-2 gap-2 sm:grid-cols-4 xl:grid-cols-6">
  ${tile('Start date',s.start)}${tile('Program day',s.day,'text-accent')}${tile('Start weight',s.sw.toFixed(2)+' lbs')}${tile('Goal weight',s.gw.toFixed(2)+' lbs')}${tile('Net loss',s.net.toFixed(2)+' lbs','text-success')}${tile('% of goal',pct(p).toFixed(2)+'%')}
  ${tile('Overall loss',s.overall.toFixed(2)+' lbs')}${tile('Inches lost',s.inches.toFixed(2)+' in')}${tile('Daily loss',s.daily)}${tile('Avg loss/day',s.avg.toFixed(2))}
  <button data-act="seen" data-id="${p.id}" class="col-span-2 flex items-center gap-2 rounded-lg border border-accent/40 bg-accent-soft px-3 py-2.5 text-left hover:border-accent" title="Click to update">${ic('cal','h-4 w-4 text-accent')}<span><span class="lbl block">Last seen</span><span class="text-sm font-semibold text-accent">${s.seen}</span></span></button>
 </div>
 ${logsBlock(p)}</div>`}
function roster(){const q=S.q.toLowerCase(),list=PATIENTS.filter(p=>p.name.toLowerCase().includes(q)&&(S.f=="All"||(S.f=="Needs review")==(p.review=="New")));
 $('#roster').innerHTML=list.length?list.map(p=>{const o=S.open.has(p.id),pc=pct(p);return `<tr data-row="${p.id}" class="cursor-pointer border-b border-line ${o?'bg-primary-soft/60':'hover:bg-canvas'}">
  <td class="px-5 py-3"><div class="flex items-center gap-3"><img src="${p.avatar}" alt="" class="h-9 w-9 rounded-full border border-line"/><div><p class="font-medium leading-tight">${p.name}</p><p class="text-xs text-muted">Day ${p.stats.day} · Started ${p.stats.start}</p></div></div></td>
  <td class="hidden px-3 xl:table-cell"><button data-act="phase" data-id="${p.id}" class="inline-flex items-center gap-1 rounded-md border border-line bg-surface px-2.5 py-1 text-xs font-medium hover:border-primary">${p.phase}${ic('chev','h-3 w-3')}</button></td>
  <td class="hidden px-3 md:table-cell"><span class="inline-block max-w-full truncate whitespace-nowrap rounded-md px-2.5 py-1 text-xs font-semibold ${PROG[p.program]||'bg-ink text-white'}">${p.program}</span></td>
  <td class="hidden px-3 sm:table-cell"><div class="flex w-36 items-center gap-2"><div class="h-2 flex-1 overflow-hidden rounded-full bg-line"><div class="h-full rounded-full bg-primary" style="width:${pc}%"></div></div><span class="w-11 text-right text-xs font-medium">${pc.toFixed(0)}%</span></div></td>
  <td class="hidden px-3 text-right font-medium text-success md:table-cell">-${p.stats.net.toFixed(1)} lbs</td>
  <td class="px-3"><button data-act="review" data-id="${p.id}" title="Toggle review status" class="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-semibold ${p.review=='New'?'bg-accent-soft text-accent':'bg-success-soft text-success'}">${ic('eye','h-3 w-3')}${p.review=='New'?'New':'Reviewed'}</button></td>
  <td class="px-3"><div class="flex items-center justify-end gap-1"><button data-act="more" data-id="${p.id}" class="rounded-md p-1.5 text-muted hover:bg-white hover:text-ink" aria-label="Patient actions">${ic('dots')}</button><span class="text-muted transition-transform ${o?'rotate-180':''}">${ic('chev')}</span></div></td></tr>
  ${o?`<tr class="border-b border-line bg-canvas"><td colspan="7" class="min-w-0 overflow-hidden p-4 lg:p-5">${detail(p)}</td></tr>`:''}`}).join(''):'<tr><td colspan="7" class="px-5 py-10 text-center text-sm text-muted">No patients match your filters.</td></tr>'}
function render(){stats();filters();roster()}

document.addEventListener('click',e=>{
 const inMenu=e.target.closest('#menu');if(!inMenu)closeMenu();
 const b=e.target.closest('[data-act]');
 if(b){const p=P(b.dataset.id),a=b.dataset.act;
  if(a=='phase')phaseMenu(b,p);else if(a=='food'||a=='meas')showPop(b,a);else if(a=='more')moreMenu(b,p);else if(a=='bell')bellMenu(b,p);
  else if(a=='seen')seen(p);else if(a=='edit')editAcct(p);else if(a=='refresh')refresh(p);else if(a=='welcome')toast('Welcome e-mail sent to '+p.email);else if(a=='archive')archive(p);else if(a=='dlmsg')toast('Preparing messages download…');else if(a=='dllog')toast('Preparing logs download…');else if(a=='readfull')readFull(p,b.dataset.k);else if(a=='syspase'){p.phase=p.sysPhase;render();toast('Phase reset to system: '+p.phase)}else if(a=='session')session(p);
  else if(a=='review'){p.review=p.review=='New'?'Reviewed':'New';render()}
  else if(a=='go')go(b.dataset.arg);else if(a=='more-logs')loadMore($(`[data-strip="${b.dataset.id}"]`));else if(a=='logscroll'){const st=$(`[data-strip="${b.dataset.id}"]`),d=+b.dataset.dir;st.scrollBy({left:d*480,behavior:'smooth'});if(d>0&&st.scrollLeft+st.clientWidth>=st.scrollWidth-40)loadMore(st)}else if(a=='filter'){S.f=b.dataset.arg;render()}
  else if(a=='copy'){navigator.clipboard&&navigator.clipboard.writeText('https://chirothintracker.com/intake?clinic_id=13');toast('Intake link copied')}
  return}
 const r=e.target.closest('tr[data-row]');
 if(r){const id=+r.dataset.row;S.open.has(id)?S.open.delete(id):S.open.add(id);roster()}
});
$('#search').addEventListener('input',e=>{S.q=e.target.value;roster()});
render();
</script>
